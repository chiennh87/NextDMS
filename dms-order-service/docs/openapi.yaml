openapi: 3.0.3
info:
  title: DMS Order Service API
  description: DMS Order Service - FMCG Distribution Management System
  version: 1.0.0
  contact:
    name: DMS Team
    email: dev@dms.local

servers:
  - url: http://localhost:8080
  - url: https://api.dms.local

tags:
  - name: orders
  - name: health
  - name: metrics

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain: {}

  /api/v1/orders:
    post:
      tags: [orders]
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400': { description: Bad Request }
        '422': { description: Unprocessable Entity }
        '429': { description: Too Many Requests }
        '500': { description: Internal Server Error }

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Get an order by ID
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404': { description: Not Found }

components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [salesman_id, outlet_id, items]
      properties:
        salesman_id: { type: string, example: SM001 }
        outlet_id: { type: string, example: OUT001 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        notes: { type: string }

    OrderItem:
      type: object
      required: [sku_id, quantity, unit_price]
      properties:
        sku_id: { type: string, example: SKU001 }
        product_name: { type: string, example: Coca Cola 330ml }
        quantity: { type: integer, minimum: 1, example: 10 }
        unit_price: { type: number, example: 15000 }
        subtotal: { type: number, example: 150000 }

    OrderResponse:
      type: object
      properties:
        id: { type: string, example: ord_1234567890 }
        salesman_id: { type: string }
        outlet_id: { type: string }
        status: { type: string, example: pending }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount: { type: number }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HealthResponse:
      type: object
      properties:
        service: { type: string }
        version: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }

    ReadinessResponse:
      type: object
      properties:
        service: { type: string }
        status: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

security:
  - BearerAuth: []